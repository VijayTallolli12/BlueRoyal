# ==============================================================================
# BLUE ROYAL HRMS — RENDER FREE STAGING BLUEPRINT (render.yaml)
# ==============================================================================
# Architecture (100% Free Tier - $0/month for Staging/UAT/Demo):
#   1. Managed PostgreSQL Database (Free Plan)
#   2. Backend Web Service (Free Plan - Runs migrations on start, ephemeral documents)
#   3. Frontend Static Site (Free Global CDN)
#
# Note: For production deployment with persistent disk & preDeployCommand,
# use render.prod.yaml.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js API - Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: blue-royal-hrms-api
    runtime: node
    plan: free # 100% Free tier (spins down after 15 min inactivity)
    region: oregon
    buildCommand: npm ci && npm run build:contracts && npm run build:database && npm run build:backend
    startCommand: npm run db:migrate && npm run start --workspace=backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: https://blue-royal-hrms.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: blue-royal-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: STORAGE_PATH
        value: storage/documents
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (Angular 19 SPA - Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: blue-royal-hrms
    runtime: static
    buildCommand: npm ci && npm run build:contracts && npm run build:frontend
    staticPublishPath: frontend/dist/blue-royal-hrms/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database (Free Tier)
# ------------------------------------------------------------------------------
databases:
  - name: blue-royal-postgres
    plan: free # 100% Free tier managed PostgreSQL
    databaseName: blue_royal_hrms
    user: blue_royal_admin
    region: oregon
