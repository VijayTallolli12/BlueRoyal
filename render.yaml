# ==============================================================================
# BLUE ROYAL HRMS — RENDER BLUEPRINT SPECIFICATION (render.yaml)
# ==============================================================================
# Architecture:
#   1. Managed PostgreSQL Database (Internal network, SSL enabled)
#   2. Backend Web Service (Node.js API + 10GB Persistent Disk + Pre-Deploy Migrations)
#   3. Frontend Static Site (Angular Production SPA with client-side rewrite rules)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js API)
  # ----------------------------------------------------------------------------
  - type: web
    name: blue-royal-hrms-api
    runtime: node
    plan: starter # Starter plan enables persistent disk attachment
    region: oregon
    buildCommand: npm ci && npm run build:contracts && npm run build:database && npm run build:backend
    startCommand: npm run start --workspace=backend
    preDeployCommand: npm run db:migrate
    healthCheckPath: /api/v1/health
    disk:
      name: blue-royal-document-storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        sync: false # Set to your frontend static site URL (e.g. https://blue-royal-hrms.onrender.com)
      - key: DATABASE_URL
        fromDatabase:
          name: blue-royal-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: STORAGE_PATH
        value: storage/documents
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (Angular 19 SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: blue-royal-hrms
    runtime: static
    buildCommand: npm ci && npm run build:contracts && npm run build:frontend
    staticPublishPath: frontend/dist/blue-royal-hrms/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: blue-royal-postgres
    plan: starter
    databaseName: blue_royal_hrms
    user: blue_royal_admin
    region: oregon
